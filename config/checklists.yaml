# Чек-листы оценки звонков.
# Источник: «Стандарты работы по телефону» (Excel) + значимость пунктов из регламента звонка (.doc).
#
# Поля пункта:
#   id        — уникальный код (не менять у существующих пунктов: по нему хранится история);
#   num       — номер пункта как в исходной таблице;
#   text      — формулировка требования;
#   weight    — значимость: high / medium / low (баллы задаются в разделе weights);
#   evaluable — false, если пункт нельзя оценить по записи разговора (в процент не входит);
#   hint      — пояснение для ИИ: как трактовать пункт и когда он «не применим».
#
# Оценка по каждому пункту: «Да» (100%) / «Нет» (0%) / «Не применимо».
# Частичное выполнение = «Нет» (правило исходной таблицы).
# Итог = средневзвешенное по применимым пунктам.

weights:
  high: 3
  medium: 2
  low: 1

weight_labels:
  high: высокая
  medium: средняя
  low: низкая

# Сведения о клинике, которые ИИ учитывает при оценке.
clinic_context: |
  Клиника лазерной хирургии «Варикоза нет» специализируется только на венах нижних конечностей
  (флебология): консультация врача-флеболога, УЗИ вен нижних конечностей, лазерное лечение варикоза,
  склеротерапия, КЛАКС. Адрес: Владивосток, ул. Лазо, 6Б (центр города, остановка «Лазо»).
  Звонки принимают и совершают администраторы клиники.
  Примеры вопросов для выявления потребностей и профильности обращения:
  «Вам необходима консультация врача-флеболога и УЗИ вен нижних конечностей? Все верно?»,
  «Ставили ли Вам диагноз варикоз?», «Вам нужно заключение перед операцией или Вы для себя хотели бы?»,
  «Есть ли какие-то внешние изменения нижних конечностей (узлы, шишки, уплотнения)?».
  Если обращение не профильное — администратор ориентирует на многопрофильный центр или единую справочную.
  Если нужно заключение (УЗИ) перед операцией — ориентирует о повышенной стоимости или предлагает
  время записи через 1–2 недели.
  Отработка отказа от записи: выяснить причины отказа и задать уточняющие вопросы; присоединиться
  к пациенту, выразить понимание; привести аргументы в пользу записи; повторно предложить запись;
  предложить перезвонить и уточнить решение.
  Эталонное прощание: «Спасибо, что доверяете нам. Если возникнут вопросы, обращайтесь по телефону …,
  буду рада помочь Вам. Всего Вам доброго».

# Общие правила применяются к любому звонку вместе с чек-листом сценария.
general:
  title: Общие правила
  criteria:
    - id: G01
      num: "1"
      text: Сотрудник в общении инициативен и проактивен
      weight: high
      hint: Сотрудник сам ведёт разговор, задаёт вопросы и предлагает решения, а не только отвечает на вопросы пациента.
    - id: G02
      num: "2"
      text: Сотрудник ВСЕГДА ориентирует Пациента по дальнейшим действиям, проговаривая на «2 шага» вперед, предвосхищая и работая на опережение
      weight: high
      hint: Пациент после разговора понимает, что будет дальше (что взять, куда прийти, кто позвонит, что делать при изменении планов).
    - id: G03
      num: "3"
      text: Используются фразы в зависимости от времени суток
      weight: medium
      hint: Приветствие/прощание соответствуют времени звонка (утро до 12:00, день 12:00–18:00, вечер после 18:00). Если время звонка неизвестно — «не применимо».
    - id: G04
      num: "4"
      text: >-
        В общении минимум дважды обращается к Пациенту по имени-отчеству. При знакомстве с Пациентом
        Сотрудник обращается к Пациенту так, как представился Пациент.
      weight: high
      hint: Посчитай обращения по имени (имени-отчеству) в репликах сотрудника. Меньше двух — «Нет». Если пациент не назвал имя, потому что сотрудник не спросил, — «Нет».
    - id: G05
      num: "5"
      text: Сотрудник обязательно проговаривает и комментирует все свои действия, направленные на решение ситуации Пациента
      weight: medium
      hint: Например, «Сейчас посмотрю расписание», «Записываю Вас», «Одну минуту, уточняю стоимость».
    - id: G06
      num: "6"
      text: Сотрудник рационально использует время Пациента, все делает быстро, не заставляет Пациента ждать.
      weight: medium
      hint: «Нет», если пациент долго ждёт без комментариев, разговор затягивается лишними повторами или сотрудник долго ищет информацию.
    - id: G07
      num: "7"
      text: Сотрудник общается вежливо, приветливо.
      weight: high
    - id: G08
      num: "8"
      text: В ходе общения с Пациентом Сотрудник доброжелателен и проявляет заботу о Пациенте.
      weight: high
    - id: G09
      num: "9"
      text: Сотрудник разговаривает с УЛЫБКОЙ и интонационными паузами.
      weight: medium
      evaluable: false
    - id: G10
      num: "10"
      text: В ходе разговора Сотрудник показывает искреннюю готовность помочь, особое расположение к Пациенту.
      weight: high
    - id: G11
      num: "11"
      text: В ходе разговора Сотрудник постоянно находится в эмоциональном контакте с Пациентом, полностью фокусируя внимание на Пациенте и его вопросах.
      weight: medium
      hint: «Нет», если сотрудник пропускает вопросы пациента мимо, переспрашивает уже сказанное, отвечает невпопад.
    - id: G12
      num: "12"
      text: >-
        Сотрудник при любом взаимодействии с Пациентом сохраняет спокойствие и доброжелательный настрой.
        ЗАПРЕЩЕНО: перебивать пациента; отвечать вопросом на вопрос пациента; игнорировать пациента;
        грубо общаться; допускать снисходительность или сарказм; допускать споры с пациентом,
        оправдания своих действий, обвинения в адрес пациента.
      weight: high
      hint: Любое из запрещённых действий — «Нет». Перебивание видно по обрывающимся репликам пациента.
    - id: G13
      num: "13"
      text: Сотрудник говорит четко, достаточно громко. Речь грамотная. Не использует в разговоре слов-«паразитов».
      weight: medium
      hint: По расшифровке оценивай только грамотность речи и слова-паразиты («как бы», «типа», «короче», «ну вот», «это самое», частые «э-э»). Громкость и чёткость по тексту не оцениваются.
    - id: G14
      num: "14"
      text: Сотрудник не использует в разговоре уменьшительно-ласкательных слов
      weight: medium
      hint: Нарушения — «минуточку», «секундочку», «паспортик», «денежки», «записочка» и т.п.
    - id: G15
      num: "15"
      text: Сотрудник в разговоре не употребляет слова «Нет», «Не знаю», «Не могу» и другие слова с использованием частицы НЕ
      weight: medium
      hint: >-
        Нарушение — отказные и негативные формулировки в адрес пациента: «нет», «не знаю», «не могу»,
        «не получится», «не записываем», «времени нет» и т.п. Вежливые служебные обороты без отказа
        (например, «не забудьте взять паспорт») нарушением не считаются.
    - id: G16
      num: "16"
      text: Хорошо ориентируется в оказываемых услугах, ценах, подробно, грамотно и полно информирует и консультирует Пациента по услугам клиники.
      weight: high
    - id: G17
      num: "17"
      text: Сотрудник подробно отвечает на вопросы Пациента. ЗАПРЕЩЕНО! Односложные ответы
      weight: high
      hint: Если пациент не задавал вопросов — «не применимо».
    - id: G18
      num: "18"
      text: Сотрудник, в процессе обслуживания Пациента, не отвлекается на посторонние вопросы.
      weight: medium
      hint: «Нет», если в записи слышны посторонние разговоры сотрудника во время звонка.
    - id: G19
      num: "19"
      text: Запрещено разговаривать на личные темы в присутствии пациентов, в том числе и по личному телефону. Личный телефон Сотрудника находится на беззвучном режиме.
      weight: medium
      evaluable: false
    - id: G20
      num: "20"
      text: Сотрудник не допускает нефункциональные действия в присутствии Пациента
      weight: medium
      evaluable: false
    - id: G21
      num: "21"
      text: Сотрудник не обсуждает Пациентов, ситуации в негативном ключе, не дает негативных оценок Пациентам и их поведению, ведет себя корректно.
      weight: high
    - id: G22
      num: "22"
      text: Сотрудник не дает недостоверную и несогласованную информацию Пациентам, не дает обещания, выполнение которых может быть под вопросом без согласования
      weight: high
    - id: G23
      num: "23"
      text: Сотрудник не обсуждает лечебные вопросы Пациента и не сообщает информацию о здоровье Пациента третьим лицам.
      weight: high
      hint: «Нет», если администратор сам ставит диагноз, советует лечение или препараты, оценивает результаты исследований вместо врача.
    - id: G24
      num: "24"
      text: Сотрудник не обсуждает «внутреннюю кухню» компании, не дает оценочных суждений о компании и коллегах.
      weight: medium
    - id: G25
      num: "25"
      text: >-
        Если нужно время для уточнения информации: если пауза не более 1 минуты — просит подождать,
        комментирует свои действия; если пауза более 2 минут — предлагает перезвонить.
      weight: medium
      hint: Если сотруднику не требовалось время на уточнение информации — «не применимо».
    - id: G26
      num: "26"
      text: >-
        Действия в конфликтных ситуациях. Сотрудник, общаясь с недовольным Пациентом:
        1) внимательно слушает, задает уточняющие вопросы; 2) выражает сожаление о случившемся или
        приносит извинения; 3) высказывает понимание потребностей Пациента и присоединяется;
        4) предлагает решение проблемы.
      weight: high
      hint: Если пациент не выражал недовольства — «не применимо».
    - id: G27
      num: "27"
      text: >-
        Пациент просит к трубке врача: Сотрудник ориентирует Пациента, что доктор находится на приеме
        или на выходном. Предлагает Пациенту уточнить его вопрос у доктора и перезвонить либо просит
        у Пациента его контактные данные, ориентирует, что передаст их доктору для связи.
      weight: medium
      hint: Если пациент не просил соединить с врачом — «не применимо».

# Сценарии звонков. Для каждого звонка применяется ровно один сценарий.
scenarios:
  incoming:
    title: Входящий звонок
    direction: in
    description: Пациент сам звонит в клинику.
    criteria:
      - id: IN01
        num: "1"
        text: Сотрудник поднимает трубку в течение 2-3 звонков
        weight: high
        evaluable: false
      - id: IN02
        num: "2"
        text: Сотрудник перезванивает Пациенту, если Пациента плохо слышно или произошел обрыв связи.
        weight: medium
        evaluable: false
      - id: IN03
        num: "3"
        text: При пропущенном вызове – Пациенту перезванивают в течение 10 минут
        weight: high
        evaluable: false
      - id: IN04
        num: "4"
        text: >-
          Сотрудник проговаривает фирменную фразу (приветствие, название клиники, должность, имя):
          «Добрый день. Клиника лазерной хирургии «Варикоза нет», администратор Анна. Слушаю Вас»
        weight: high
        hint: Должны прозвучать все элементы — приветствие, полное название клиники, должность, имя. Пропуск любого — «Нет».
      - id: IN05
        num: "5"
        text: Сотрудник дает ответ на первичный запрос Пациента
        weight: medium
      - id: IN06
        num: "6"
        text: Сотрудник уточняет имя Пациента
        weight: high
        hint: Например, «Как я могу к Вам обращаться?». Если пациент назвал имя сам до вопроса — «Да».
      - id: IN07
        num: "7"
        text: Сотрудник уточняет первичный/постоянный Пациент
        weight: high
      - id: IN08
        num: "8"
        text: Сотрудник задает уточняющие вопросы, выявляет потребности Пациента и уточняет профильность обращения.
        weight: high
      - id: IN08_1
        num: "8.1"
        text: Обращение профильное (вены нижних конечностей) – Сотрудник резюмирует то, что сказал Пациент и записывает Пациента на прием
        weight: high
        hint: Если обращение не профильное — «не применимо».
      - id: IN08_2
        num: "8.2"
        text: Обращение для УЗИ перед операцией – Сотрудник ориентирует Пациента о повышенной стоимости или предлагает время записи через 1-2 недели
        weight: high
        hint: Если пациенту не нужно УЗИ/заключение перед операцией — «не применимо».
      - id: IN08_3
        num: "8.3"
        text: >-
          НЕ профильное обращение – Сотрудник ориентирует Пациента, что клиника специализируется только
          на венах нижних конечностей и для решения вопроса нужно обратиться в многопрофильный центр.
          Если Пациент просит посоветовать, куда обратиться, — ориентирует на Единую справочную.
        weight: high
        hint: Если обращение профильное — «не применимо».
      - id: IN09
        num: "9"
        text: >-
          Сотрудник проговаривает Пациенту фразу, побуждающую к записи: «Я предлагаю Вам записаться на
          консультацию/прием…», «Могу вам предложить…», «Давайте запишемся…», «Давайте подберем удобное для вас время...»
        weight: high
        hint: Если обращение не профильное и запись не предполагается — «не применимо».
      - id: IN10
        num: "10"
        text: >-
          Сотрудник предлагает время записи: «Смотрим ближайшее время?», далее методом «вилка»:
          «Вам удобнее будни или выходные?», «Вам удобнее утро, день или вечер?», «Есть время на 12.30
          и на 15.00. Когда вам будет удобнее?». ЗАПРЕЩЕНО говорить, что времени нет.
        weight: high
        hint: «Да», если сотрудник предлагает варианты на выбор (вилка). Вопрос «на когда Вас записать?» без вариантов — «Нет». Если запись не предполагается — «не применимо».
      - id: IN11
        num: "11"
        text: Сотрудник проговаривает ФИО и регалии врача, к которому записывает Пациента.
        weight: high
        hint: Нужны и ФИО, и регалии (специализация, стаж, степень, категория). Если запись не состоялась — «не применимо».
      - id: IN12
        num: "12"
        text: >-
          Сотрудник записывает контактные данные (ФИО, дата рождения, телефон, по которому можно связаться
          с Пациентом). Если Пациент уже был в клинике, Сотрудник проводит сверку контактного телефона.
        weight: high
        hint: Если запись не состоялась — «не применимо».
      - id: IN13
        num: "13"
        text: Первичного Пациента Сотрудник спрашивает откуда он узнал о клинике
        weight: high
        hint: Если пациент постоянный или запись не состоялась — «не применимо».
      - id: IN14
        num: "14"
        text: При осуществлении записи на прием, Сотрудник резюмирует и повторно проговаривает дату, время, адрес, ФИО врача.
        weight: high
        hint: Все четыре элемента в итоговом резюме. Если запись не состоялась — «не применимо».
      - id: IN15
        num: "15"
        text: Для первичного Пациента Сотрудник ориентирует как добраться и где можно припарковаться.
        weight: high
        hint: Достаточно предложить сориентировать, как добраться. Если пациент постоянный или запись не состоялась — «не применимо».
      - id: IN16
        num: "16"
        text: Сотрудник информирует Пациента о стоимости приема. Если идет акция, то проговаривает, что стоимость приема по акции.
        weight: high
      - id: IN17
        num: "17"
        text: Сотрудник информирует о необходимости принести результаты предыдущих исследований, если таковые имеются
        weight: low
        hint: Если запись не состоялась — «не применимо».
      - id: IN18
        num: "18"
        text: >-
          Если Пациент первичный или был в клинике более года назад, Сотрудник сообщает, какие необходимо
          взять документы (паспорт, СНИЛС) и что нужно подойти за 10-15 минут до начала приема для заполнения документов.
        weight: high
        hint: Нужны оба элемента — документы и прийти заранее. Если пациент был в клинике недавно или запись не состоялась — «не применимо».
      - id: IN19
        num: "19"
        text: Сотрудник дает полную информацию о подготовке или ограничениях к приему (при необходимости, например, при планировании операции или КЛАКС/склеротерапии)
        weight: low
        hint: Если запись на консультацию/УЗИ без процедур — «не применимо».
      - id: IN20
        num: "20"
        text: >-
          Сотрудник информирует о том, что за день Пациенту позвонят и напомнят о приеме. Также
          проговаривает, чтобы Пациент предупредил, если у него изменятся планы. При отмене записи
          Пациентом Сотрудник ОБЯЗАТЕЛЬНО предлагает перенести прием на другое время.
        weight: high
        hint: Нужны оба элемента. Если запись не состоялась — «не применимо».
      - id: IN21
        num: "21"
        text: >-
          При отказе Пациента от записи Сотрудник: 1) отрабатывает возражения; 2) повторно предлагает
          записаться; 3) если Пациент отказывается, предлагает перезвонить.
        weight: high
        hint: Если пациент не отказывался от записи — «не применимо».
      - id: IN22
        num: "22"
        text: >-
          Перед тем, как закончить разговор, Сотрудник задает завершающий контакт вопрос: «Могу вам еще
          чем-нибудь помочь?», «Может быть у Вас остались еще какие-либо вопросы?»
        weight: medium
