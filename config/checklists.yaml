        hint: «Нет», если разговор оборван сотрудником до прощания пациента. Если по записи определить нельзя — «не применимо».

  out_reschedule:
    title: Исходящий звонок — перенос приёма
    direction: out
    description: Клиника переносит приём (врач заболел, изменилось расписание) и звонит пациенту.
    criteria:
      - id: RS01
        num: "1"
        text: Сотрудник звонит Пациенту в интервал с 10.00 до 20.00
        weight: medium
        evaluable: false
      - id: RS02
        num: "2"
        text: При исходящем звонке необходимо ждать, пока Вам ответят, в течение 3–5 гудков.
        weight: medium
        evaluable: false
      - id: RS03
        num: "3"
        text: >-
          Если с первого раза до Пациента не дозвонились: в течение дня делает 5 дозвонов с интервалом
          в 1 час; в программе в примечании ставит н/о, время и количество звонков.
        weight: medium
        evaluable: false
      - id: RS04
        num: "4"
        text: >-
          Представляется фирменным речевым модулем: «Добрый день (вечер, утро). Клиника лазерной хирургии
          «Варикоза нет», Администратор Мария»
        weight: high
        hint: Должны прозвучать приветствие, полное название клиники, должность и имя.
      - id: RS05
        num: "5"
        text: Сотрудник убеждается, что у телефона нужный нам человек
        weight: medium
      - id: RS06
        num: "6"
        text: >-
          Сотрудник уточняет, удобно ли разговаривать. Если Пациенту неудобно — договаривается о перезвоне
          и перезванивает в оговоренное время.
        weight: medium
      - id: RS07
        num: "7"
        text: >-
          Сотрудник озвучивает цель звонка: «Петр Иванович, мы звоним Вам по поручению Вашего доктора
          Иванова Ивана Ивановича. К сожалению, *причина* (доктор заболел, изменения в расписании и т.д.),
          и мы хотим Вас предупредить, что время Вашего приема переносится. Приносим извинения от лица клиники».
        weight: high
        hint: Нужны причина переноса и извинения от лица клиники.
      - id: RS08
        num: "8"
        text: Не дожидаясь ответа Пациента, Сотрудник предлагает подобрать время нового визита
        weight: high
      - id: RS09
        num: "9"
        text: ПАЦИЕНТ СОГЛАСЕН ЗАПИСАТЬСЯ — Сотрудник благодарит за ответ и понимание и предлагает время в соответствии со Стандартом Входящего звонка (метод «вилка»)
        weight: high
        hint: Если пациент отказался от переноса — «не применимо».
      - id: RS10
        num: "10"
        text: >-
          ПАЦИЕНТ ОТКАЗЫВАЕТСЯ ЗАПИСАТЬСЯ — Сотрудник: 1) выявляет причину отказа, потребности Пациента,
          задает уточняющие вопросы; 2) отрабатывает возражения; 3) повторно предлагает записаться;
          4) если Пациент отказывается, предлагает перезвонить.
        weight: high
        hint: Если пациент согласился на перенос — «не применимо».
      - id: RS11
        num: "11"
        text: >-
          Перед тем, как закончить разговор, Сотрудник задает завершающий контакт вопрос: «Могу вам еще
          чем-нибудь помочь?», «Может быть у Вас остались еще какие-либо вопросы?»
        weight: medium
      - id: RS12
        num: "12"
        text: Сотрудник прощается и благодарит за доверие
        weight: medium
      - id: RS13
        num: "13"
        text: Сотрудник кладет трубку после того, как Пациент попрощался
        weight: low
        hint: «Нет», если разговор оборван сотрудником до прощания пациента. Если по записи определить нельзя — «не применимо».

